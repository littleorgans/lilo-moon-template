name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Only here: a called workflow reports the caller's name as github.workflow, so the same group in
# moon-ci.yml would cancel this run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  moon:
    name: Moon
    permissions:
      contents: read
    uses: ./.github/workflows/moon-ci.yml
    with:
      runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

  # Branch protection requires the check "CI". A called workflow's job reports as "Moon / moon ci",
  # so this job keeps the required name. It runs whatever happened above: a skipped required check
  # counts as passing, so it must not be skippable.
  ci:
    name: CI
    needs: moon
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require moon ci to pass
        run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.moon.result }}
