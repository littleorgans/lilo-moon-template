name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
          cache: pnpm

      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
        with:
          moon-version: "2.5.1"

      - name: Install dependencies
        # Fails when the lockfile is stale or an integrity hash does not match.
        run: pnpm install --frozen-lockfile

      - name: moon ci
        run: moon ci
        env:
          MOON_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          MOON_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
