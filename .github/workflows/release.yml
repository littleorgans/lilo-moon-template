name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      # HELIOY_PAT, when set, makes the version PR come from a user rather than from
      # github-actions[bot]. A bot-authored PR can land in an approval-required state, and until a
      # maintainer approves it the required CI check never reports, so the PR cannot merge. Falling
      # back to GITHUB_TOKEN keeps a clone working with no secret configured, at the cost of that
      # manual approval on every release.
      #
      # Rename this secret when you instantiate. `just rename` does not rewrite it, because it is
      # not one of the template identity tokens, so it will follow a clone unnoticed. The fallback
      # is what keeps that harmless rather than broken.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.HELIOY_PAT || secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
          cache: pnpm

      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
        with:
          moon-version: "2.5.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create version PR or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: pnpm changeset:version
          # Publishing stays disabled unless NPM_PUBLISH_ENABLED compares equal to true. Configure
          # npm trusted publishing for every package before enabling it.
          publish: ${{ vars.NPM_PUBLISH_ENABLED == 'true' && 'pnpm changeset:publish' || '' }}
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.HELIOY_PAT || secrets.GITHUB_TOKEN }}
