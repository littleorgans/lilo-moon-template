# Inherited only by JavaScript applications. Library build tasks belong in
# node-library.yml. Keep this out of node.yml so libraries do not grow a
# Vite dev server.

inheritedBy:
  toolchains: ["javascript"]
  layers: ["application"]

tasks:
  build:
    type: "build"
    command: "vite build"
    inputs:
      - "@globs(sources)"
      - "package.json"
      - "tsconfig.json"
      - "vite.config.*"
      - "public/**/*"
      - "/tsconfig.options.json"
    deps:
      - "^:build"
    outputs:
      - ".output"
    options:
      runInCI: "always"

  dev:
    type: "run"
    command: "vite"
    options:
      cache: false
      # Vite reads .env files only to populate `import.meta.env`, and only for names it is told to
      # expose. It never writes `process.env`, which is where the application reads configuration,
      # and it looks beside vite.config.ts rather than at the workspace root. So the file
      # .env.example tells you to create was loaded by nothing. moon loads it here instead, which
      # keeps the one copy of the secrets at the root where .gitignore already covers it.
      envFile: "/.env.local"
      persistent: true
      runInCI: false

  preview:
    type: "run"
    command: "node .output/server/index.mjs"
    # Preview is a Nitro server, not `vite preview`, so it never reads vite.config.ts. It takes the
    # port from the environment, which is the only place the pin has any effect. It must match the
    # dev server so one registered OAuth redirect URI serves both.
    env:
      PORT: "5199"
    deps:
      - "~:build"
    options:
      cache: false
      # Same file as dev, for the same reason. A Nitro server reads process.env and nothing puts
      # .env.local there.
      envFile: "/.env.local"
      persistent: true
      runInCI: false
