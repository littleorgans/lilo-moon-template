# Inherited only by JavaScript applications. Library build tasks belong in
# node-library.yml. Keep this out of node.yml so libraries do not grow a
# Vite dev server.

inheritedBy:
  toolchains: ["javascript"]
  layers: ["application"]

tasks:
  build:
    type: "build"
    command: "vite build"
    inputs:
      - "@globs(sources)"
      - "package.json"
      - "tsconfig.json"
      - "vite.config.*"
      - "public/**/*"
      - "/tsconfig.options.json"
    deps:
      - "^:build"
    outputs:
      - ".output"
    options:
      runInCI: "always"

  dev:
    type: "run"
    command: "vite"
    options:
      cache: false
      persistent: true
      runInCI: false

  preview:
    type: "run"
    command: "node .output/server/index.mjs"
    # Preview is a Nitro server, not `vite preview`, so it never reads vite.config.ts. It takes the
    # port from the environment, which is the only place the pin has any effect. It must match the
    # dev server so one registered OAuth redirect URI serves both.
    env:
      PORT: "5199"
    deps:
      - "~:build"
    options:
      cache: false
      persistent: true
      runInCI: false
