# Vite and Nitro tasks for JavaScript applications tagged web-app.
# Other application runtimes declare their own tasks.

inheritedBy:
  toolchains: ["javascript"]
  layers: ["application"]
  tags: ["web-app"]

tasks:
  build:
    type: "build"
    command: "vite build"
    inputs:
      - "@globs(sources)"
      - "package.json"
      - "tsconfig.json"
      - "vite.config.*"
      - "public/**/*"
      - "@files(typescript-options)"
    deps:
      - "^:build"
    outputs:
      - ".output"
    options:
      shell: false
      runInCI: "always"

  dev:
    type: "run"
    command: "vite"
    options:
      shell: false
      cache: false
      # Vite reads .env files only to populate `import.meta.env`, and only for names it is told to
      # expose. It never writes `process.env`, which is where the application reads configuration,
      # and it looks beside vite.config.ts rather than at the workspace root. So the file
      # .env.example tells you to create was loaded by nothing. moon loads it here instead, which
      # keeps the one copy of the secrets at the root where .gitignore already covers it.
      envFile: "/.env.local"
      persistent: true
      runInCI: false

  preview:
    type: "run"
    command: "node .output/server/index.mjs"
    deps:
      - "~:build"
    options:
      shell: false
      cache: false
      # Same file as dev, for the same reason. A Nitro server reads process.env and nothing puts
      # .env.local there.
      envFile: "/.env.local"
      persistent: true
      runInCI: false
