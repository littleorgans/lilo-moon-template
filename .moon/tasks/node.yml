# Inherited by every project that uses the JavaScript toolchain.
# A project overrides a task by redeclaring it in its own moon.yml.

inheritedBy:
  toolchains: ["javascript"]

fileGroups:
  sources:
    - "src/**/*"
    - "package.json"
    - "tsconfig.json"
  tests:
    - "tests/**/*"
    - "**/*.test.ts"
    - "**/*.test.tsx"
  configs:
    - "tsconfig.json"
    - "vite.config.*"
    - "vitest.config.*"
  # Workspace configuration every project compiles or tests with. In this repo the settings live in
  # the config packages, which no project depends on, so without these a change there would replay
  # cached typechecks, builds and tests. A project that installs the packages has no such paths.
  typescript-options:
    - "/tsconfig.options.json"
    - "/packages/tsconfig/base.json"
  vitest-config:
    - "/vitest.config.ts"
    - "/packages/vite-config/src/vitest.ts"

# Workspace packages export dist. Put ^:build on each task that resolves
# those exports. File-level implicitDeps would also attach it to `dev`.
tasks:
  typecheck:
    type: "build"
    command: "tsc --build --pretty"
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - "@globs(configs)"
      - "@files(typescript-options)"
    deps:
      - "^:typecheck"
      - "^:build"
    options:
      shell: false
      runInCI: "always"

  test:
    type: "test"
    command: "vitest run --config $workspaceRoot/vitest.config.ts --root $projectRoot"
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - "@globs(configs)"
      - "@files(vitest-config)"
    deps:
      - "^:build"
    options:
      shell: false
      runInCI: false

  test-coverage:
    type: "test"
    command: >-
      vitest run --coverage --config $workspaceRoot/vitest.config.ts --root $projectRoot
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - "@globs(configs)"
      - "@files(vitest-config)"
    deps:
      - "^:build"
    outputs:
      - "coverage"
    options:
      shell: false
      runInCI: "always"

  test-watch:
    type: "run"
    command: "vitest --config $workspaceRoot/vitest.config.ts --root $projectRoot"
    deps:
      - "^:build"
    options:
      shell: false
      cache: false
      persistent: true
      runInCI: false
