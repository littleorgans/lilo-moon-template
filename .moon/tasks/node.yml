# Inherited by every project that uses the JavaScript toolchain.
# A project overrides a task by redeclaring it in its own moon.yml.

inheritedBy:
  toolchains: ["javascript"]

fileGroups:
  sources:
    - "src/**/*"
    - "package.json"
    - "tsconfig.json"
  tests:
    - "tests/**/*"
    - "**/*.test.ts"
    - "**/*.test.tsx"
  configs:
    - "tsconfig.json"
    - "vite.config.*"
    - "vitest.config.*"

# Workspace packages export dist. Put ^:build on each task that resolves
# those exports. File-level implicitDeps would also attach it to `dev`.
tasks:
  typecheck:
    type: "build"
    command: "tsc --build --pretty"
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - "@globs(configs)"
    deps:
      - "^:typecheck"
      - "^:build"
    options:
      runInCI: "always"

  test:
    type: "test"
    command: "vitest run"
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - "@globs(configs)"
    deps:
      - "^:build"
    options:
      runInCI: "always"

  test-watch:
    type: "run"
    command: "vitest"
    deps:
      - "^:build"
    options:
      cache: false
      persistent: true
      runInCI: false
