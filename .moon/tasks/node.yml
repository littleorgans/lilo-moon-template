# Inherited by every project that uses the JavaScript toolchain.
# A project overrides a task by redeclaring it in its own moon.yml.

inheritedBy:
  toolchains: ["javascript"]

# Workspace packages export dist. Every javascript consumer, library or
# application, waits on dependency builds so it does not typecheck or bundle
# a missing or stale dist.
implicitDeps:
  - "^:build"

fileGroups:
  sources:
    - "src/**/*"
    - "package.json"
    - "tsconfig.json"
  tests:
    - "tests/**/*"
    - "**/*.test.ts"
    - "**/*.test.tsx"
  configs:
    - "tsconfig.json"
    - "vite.config.*"
    - "vitest.config.*"

tasks:
  typecheck:
    type: "build"
    command: "tsc --build --pretty"
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - "@globs(configs)"
    deps:
      - "^:typecheck"
    options:
      runInCI: "always"

  test:
    type: "test"
    command: "vitest run"
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - "@globs(configs)"
    options:
      runInCI: "always"

  test-watch:
    type: "run"
    command: "vitest"
    options:
      cache: false
      persistent: true
      runInCI: false
