# Workspace layout and version control.
# Toolchains live in toolchains.yml; inherited tasks live in tasks/.

# Runtime refuse. Must equal moon in .prototools. CI installs that pin,
# so a bump to one file without the other fails moon. Independent of littleorgans.
versionConstraint: "=2.5.5"

projects:
  globs:
    - "apps/*"
    - "packages/*"
    - "services/*"
  sources:
    root: "."
    # The project's typed Drizzle schema, beside the SQL it is generated from.
    drizzle-schema: "db/drizzle"

vcs:
  client: "git"
  defaultBranch: "main"
  provider: "github"
