# The repository root as a project. Owns the workspace-wide quality gates:
# oxlint, oxfmt, secretlint, and pnpm audit run once rather than per project.
# project-refs evaluates the root tsconfig; per-project typecheck cannot.

layer: "application"

# The root is a task holder, not a TypeScript project. It must not inherit
# the per-project tasks in .moon/tasks/node.yml.
# inheritedTasks.include stops tasks, not fileGroups. replace keeps the
# root sources list from merging with node.yml globs.
workspace:
  inheritedTasks:
    include: []
  mergeStrategies:
    fileGroups: "replace"

fileGroups:
  sources:
    - ".moon/**/*"
    - "apps/**/*"
    - "packages/**/*"
    - "services/**/*"
    - "scripts/**/*"
    - "packages/db/migrations/**/*"
    - "db/schema.sql"
    - "db/drizzle/**/*"
    # Generated and installed files must not invalidate source task caches.
    - "!.moon/cache/**/*"
    - "!.moon/docker/**/*"
    - "!**/node_modules/**/*"
    - "!**/dist/**/*"
    - "!**/.output/**/*"
    - "!**/build/**/*"
    - "!**/out/**/*"
    - "!**/coverage/**/*"
    - "!**/*.tsbuildinfo"
    - "package.json"
    - "pnpm-workspace.yaml"
    - "tsconfig.json"
    - "tsconfig.options.json"
  # Empty lists replace inherited node.yml globs for these group names.
  configs: []
  tests: []

tasks:
  prune-references:
    description: "Prune generated root references after removing workspace members"
    type: "run"
    command: "node scripts/prune-references.mjs"
    options:
      shell: false
      cache: false
      runInCI: false

  clean:
    type: "run"
    script: "db-tools clean && moon clean"
    deps:
      - "^:build"
    options:
      cache: false
      runInCI: false

  published-shape:
    description: "Prove the gates on a workspace snapshot, then install and check every packed library"
    type: "test"
    command: "node scripts/published-shape.mjs"
    # CI runs it when anything that is built, packed, installed or gated changes, and skips it for
    # documentation alone. sources covers apps, packages, services, scripts, .moon and the root
    # manifests; the rest is what the snapshot's gates and pnpm pack read from the root.
    inputs:
      - "@globs(sources)"
      - "pnpm-lock.yaml"
      - "moon.yml"
      - ".pnpmfile.*"
      - ".gitignore"
      - ".npmignore"
      - ".gitattributes"
      - ".editorconfig"
      - "LICENSE"
      - ".npmrc"
      - ".prototools"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - "vitest.config.ts"
    # The script imports the Postgres container helper from @littleorgans/db-tools's build.
    deps:
      - "^:build"
    options:
      shell: false
      cache: false
      runInCI: true

  tsgolint-lockstep:
    description: "Verify repository TypeScript and type aware lint pins agree"
    type: "test"
    command: "node scripts/assert-tsgolint-lockstep.mjs"
    inputs:
      - "package.json"
      - "pnpm-workspace.yaml"
      - "scripts/assert-tsgolint-lockstep.mjs"
    options:
      shell: false
      runInCI: "always"

  scripts-test:
    type: "test"
    command: "node"
    args: ["--test", "scripts/tests/**/*.test.mjs"]
    inputs:
      - "scripts/**/*"
      - "/LICENSE"
      - "/{apps,packages,services}/*/LICENSE"
      - "/{apps,packages,services}/*/package.json"
      - "/{apps,packages,services}/*/moon.yml"
      - "/.changeset/config.json"
      - "moon.yml"
      # Configuration only: .moon/cache changes on every run, so a .moon/**/* input never caches.
      - ".moon/*.yml"
      - ".moon/tasks/**/*"
      - "renovate.json"
      - "renovate/**/*"
      - ".github/workflows/**/*"
      - ".prototools"
    options:
      shell: false
      runInCI: "always"

  lint:
    type: "test"
    command: "oxlint --type-aware --deny-warnings --no-error-on-unmatched-pattern"
    inputs:
      - "@globs(sources)"
      - ".oxlintrc.json"
    # Type-aware lint needs the workspace packages' declarations, and declarations come from a
    # build. Without this edge oxlint reads `@littleorgans/db` as an error type that acts as `any`,
    # then reports it as no-redundant-type-constituents: a message that names a union, not the
    # missing build. It passed locally only because dist was already there from an earlier run,
    # and failed on a clean runner. Tagged rather than listed, so a new library inherits the edge
    # when it declares the ts-library tag.
    deps:
      - "#ts-library:build"
    options:
      shell: false
      runInCI: "always"

  lint-fix:
    type: "run"
    command: "oxlint --type-aware --fix --no-error-on-unmatched-pattern"
    options:
      shell: false
      cache: false
      runInCI: false

  format-check:
    type: "test"
    command: "oxfmt --check --no-error-on-unmatched-pattern"
    inputs:
      - "@globs(sources)"
      # oxfmt also scans documentation and repository configuration outside source projects.
      - "*"
      - ".*"
      - "docs/**/*"
      - ".github/**/*"
      - ".vscode/**/*"
      - ".changeset/**/*"
    options:
      shell: false
      runInCI: "always"

  format:
    type: "run"
    command: "oxfmt --no-error-on-unmatched-pattern"
    options:
      shell: false
      cache: false
      runInCI: false

  # A workspace without a root tsconfig has no project references to check.
  # When it exists, --dry reports TS6053 for a dangling path and does not emit.
  # Member config globs invalidate the task on additions, removals, and edits.
  project-refs:
    type: "test"
    script: "test ! -f tsconfig.json || tsc --build --pretty --dry"
    inputs:
      - "apps/*/tsconfig*.json"
      - "packages/*/tsconfig*.json"
      - "services/*/tsconfig*.json"
      - "db/drizzle/tsconfig*.json"
      - "tsconfig.json"
      - "tsconfig.options.json"
    options:
      runInCI: "always"

  # db/schema.sql is the applicability boundary for every Atlas task. An absent
  # schema skips before Atlas or Docker starts. Once present, failures propagate.
  atlas-diff:
    description: "Generate a versioned migration from db/schema.sql"
    type: "run"
    command: "db-tools atlas-diff --migrations packages/db/migrations"
    deps:
      - "^:build"
    checks:
      - check: "condition"
        script: "test ! -f db/schema.sql"
    options:
      shell: false
      cache: false
      runInCI: false

  atlas-lint:
    description: "Reject unsafe versioned migrations"
    type: "test"
    # Atlas's docker:// driver publishes to a random host port; db-tools runs the dev database in
    # this checkout's container instead. It skips locally without Docker and fails in CI.
    command: "db-tools atlas-lint --migrations packages/db/migrations"
    deps:
      - "^:build"
    checks:
      - check: "condition"
        script: "test ! -f db/schema.sql"
    options:
      shell: false
      cache: false
      runInCI: "always"

  atlas-apply:
    description: "Apply pending migrations to DATABASE_URL"
    type: "run"
    command: "db-tools atlas-apply --migrations packages/db/migrations"
    deps:
      - "^:build"
    checks:
      - check: "condition"
        script: "test ! -f db/schema.sql"
    options:
      shell: false
      cache: false
      runInCI: false

  drizzle-generate:
    description: "Regenerate Drizzle types from the applied Atlas migrations"
    type: "run"
    command: "db-tools drizzle-generate --migrations packages/db/migrations"
    deps:
      - "^:build"
    checks:
      - check: "condition"
        script: "test ! -f db/schema.sql"
    options:
      shell: false
      cache: false
      runInCI: false

  drizzle-check:
    description: "Verify Drizzle types match the applied Atlas migrations"
    type: "test"
    command: "db-tools drizzle-check --migrations packages/db/migrations"
    inputs:
      - "packages/db/migrations/**/*"
      - "packages/db-tools/src/**/*"
      - "db/schema.sql"
      - "db/drizzle/_generated/**/*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
    deps:
      - "^:build"
    checks:
      - check: "condition"
        script: "test ! -f db/schema.sql"
    options:
      shell: false
      cache: false
      runInCI: "always"

  # Neither db/schema.sql nor the Drizzle artifact records what the policies do: Atlas Community
  # drops them from a diff and drizzle-kit pull drops the USING expression from SELECT policies.
  # This task applies the migrations and observes the database, so it is the only gate that can
  # tell a scoped policy from an open one.
  rls-verify:
    description: "Prove row level security scopes rows in a real database"
    type: "test"
    command: "node scripts/rls-verify.mjs"
    inputs:
      - "packages/db/migrations/**/*"
      - "packages/db-tools/src/**/*"
      - "db/schema.sql"
      - "scripts/rls-verify.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
    # The generic checks come from @littleorgans/db-tools's build, like any consumer's. A project
    # edge rather than a named target: published-shape's packed copy has no packages to build.
    deps:
      - "^:build"
    checks:
      - check: "condition"
        script: "test ! -f db/schema.sql"
    options:
      shell: false
      cache: false
      runInCI: "always"

  secrets:
    type: "test"
    command: "node scripts/check-security.mjs"
    inputs:
      - "@globs(sources)"
      - "/.github/**/*"
      - "/.env.example"
      - "/.npmrc"
      - "/.secretlintrc.json"
      - "/.secretlintignore"
    options:
      shell: false
      cache: false
      runInCI: "always"

  # secrets skips dist, and dist is most of what npm receives. The release gate runs the same scan
  # on the tarballs it publishes: node scripts/check-packed-secrets.mjs <release directory>.
  packed-secrets:
    description: "Scan the packed tarball of every published package for secrets"
    type: "test"
    command: "node scripts/check-packed-secrets.mjs"
    inputs:
      - "@globs(sources)"
      - "/.secretlintrc.json"
    deps:
      - "#ts-library:build"
    options:
      shell: false
      cache: false
      runInCI: true

  # The publish half of release.yml against a local Verdaccio: the refusal of a tarball changed
  # after the scan, a partial failure and the rerun that completes it, and the post-publish smoke.
  release-rehearsal:
    description: "Rehearse publishing the release tarballs against a local registry"
    type: "test"
    command: "node scripts/release-rehearsal.mjs"
    inputs:
      - "scripts/release.mjs"
      - "scripts/release-rehearsal.mjs"
      - "scripts/check-packed-secrets.mjs"
      - "scripts/lib/**/*"
      - "/.github/workflows/release.yml"
      - "/.secretlintrc.json"
      - "/pnpm-workspace.yaml"
    deps:
      - "#ts-library:build"
    options:
      shell: false
      cache: false
      runInCI: true

  audit:
    type: "test"
    command: "pnpm audit"
    inputs:
      - "/package.json"
      - "/pnpm-lock.yaml"
      - "/pnpm-workspace.yaml"
    options:
      shell: false
      cache: false
      runInCI: "always"
