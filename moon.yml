# The repository root as a project. Owns the workspace-wide quality gates:
# oxlint, oxfmt, secretlint, and pnpm audit run once rather than per project.
# project-refs evaluates the root tsconfig; per-project typecheck cannot.

layer: "application"

# The root is a task holder, not a TypeScript project. It must not inherit
# the per-project tasks in .moon/tasks/node.yml.
# inheritedTasks.include stops tasks, not fileGroups. replace keeps the
# root sources list from merging with node.yml globs.
workspace:
  inheritedTasks:
    include: []
  mergeStrategies:
    fileGroups: "replace"

fileGroups:
  sources:
    - ".moon/**/*"
    - "apps/**/*"
    - "packages/**/*"
    - "services/**/*"
    - "scripts/**/*"
    - "db/migrations/**/*"
    - "db/schema.sql"
    # Generated and installed files must not invalidate source task caches.
    - "!.moon/cache/**/*"
    - "!.moon/docker/**/*"
    - "!**/node_modules/**/*"
    - "!**/dist/**/*"
    - "!**/.output/**/*"
    - "!**/build/**/*"
    - "!**/out/**/*"
    - "!**/coverage/**/*"
    - "!**/*.tsbuildinfo"
    - "package.json"
    - "pnpm-workspace.yaml"
    - "tsconfig.json"
    - "tsconfig.options.json"
  # Empty lists replace inherited node.yml globs for these group names.
  configs: []
  tests: []

tasks:
  new-project:
    type: "run"
    command: "node scripts/projects.mjs create"
    options:
      shell: false
      cache: false
      runInCI: false

  projects:
    type: "run"
    command: "node scripts/projects.mjs list"
    options:
      shell: false
      cache: false
      runInCI: false

  project-register:
    type: "run"
    command: "node scripts/projects.mjs register"
    options:
      shell: false
      cache: false
      runInCI: false

  rename:
    type: "run"
    command: "bash scripts/rename-template.sh"
    options:
      shell: false
      cache: false
      runInCI: false

  rename-verify:
    type: "run"
    command: "bash scripts/rename-template.sh --verify"
    options:
      shell: false
      cache: false
      runInCI: false

  prune-references:
    description: "Prune generated root references after removing workspace members"
    type: "run"
    command: "node scripts/prune-references.mjs"
    options:
      shell: false
      cache: false
      runInCI: false

  clean:
    type: "run"
    script: "node scripts/clean.mjs && moon clean"
    options:
      cache: false
      runInCI: false

  consumer-check:
    description: "Generate, customize and run a consumer, then repeat with packed libraries"
    type: "test"
    command: "node scripts/consumer-check.mjs"
    inputs:
      - "@globs(sources)"
      - "scripts/**/*"
      - "pnpm-lock.yaml"
    options:
      shell: false
      cache: false
      runInCI: "always"

  tsgolint-lockstep:
    description: "Verify repository TypeScript and type aware lint pins agree"
    type: "test"
    command: "node scripts/assert-tsgolint-lockstep.mjs"
    inputs:
      - "package.json"
      - "pnpm-workspace.yaml"
      - "scripts/assert-tsgolint-lockstep.mjs"
    options:
      shell: false
      runInCI: "always"

  scripts-test:
    type: "test"
    command: "node"
    args: ["--test", "scripts/tests/**/*.test.mjs"]
    inputs:
      - "scripts/**/*"
      - "moon.yml"
      - ".moon/**/*"
      - "renovate.json"
      - ".github/workflows/**/*"
      - ".prototools"
    options:
      shell: false
      runInCI: "always"

  lint:
    type: "test"
    command: "oxlint --type-aware --deny-warnings --no-error-on-unmatched-pattern"
    inputs:
      - "@globs(sources)"
      - ".oxlintrc.json"
    # Type-aware lint needs the workspace packages' declarations, and declarations come from a
    # build. Without this edge oxlint reads `@lilo-moon/db` as an error type that acts as `any`,
    # then reports it as no-redundant-type-constituents: a message that names a union, not the
    # missing build. It passed locally only because dist was already there from an earlier run,
    # and failed on a clean runner. Tagged rather than listed, so a new library inherits the edge
    # when it declares the ts-library tag.
    deps:
      - "#ts-library:build"
    options:
      shell: false
      runInCI: "always"

  lint-fix:
    type: "run"
    command: "oxlint --type-aware --fix --no-error-on-unmatched-pattern"
    options:
      shell: false
      cache: false
      runInCI: false

  format-check:
    type: "test"
    command: "oxfmt --check --no-error-on-unmatched-pattern"
    inputs:
      - "@globs(sources)"
      # oxfmt also scans documentation and repository configuration outside source projects.
      - "*"
      - ".*"
      - "docs/**/*"
      - ".github/**/*"
      - ".vscode/**/*"
      - ".changeset/**/*"
      - ".template/**/*"
      - "!.template/local/**/*"
    options:
      shell: false
      runInCI: "always"

  format:
    type: "run"
    command: "oxfmt --no-error-on-unmatched-pattern"
    options:
      shell: false
      cache: false
      runInCI: false

  # A workspace without a root tsconfig has no project references to check.
  # When it exists, --dry reports TS6053 for a dangling path and does not emit.
  # Member config globs invalidate the task on additions, removals, and edits.
  project-refs:
    type: "test"
    script: "test ! -f tsconfig.json || tsc --build --pretty --dry"
    inputs:
      - "apps/*/tsconfig*.json"
      - "packages/*/tsconfig*.json"
      - "services/*/tsconfig*.json"
      - "tsconfig.json"
      - "tsconfig.options.json"
    options:
      runInCI: "always"

  # db/schema.sql is the applicability boundary for every Atlas task. An absent
  # schema skips before Atlas or Docker starts. Once present, failures propagate.
  atlas-diff:
    description: "Generate a versioned migration from db/schema.sql"
    type: "run"
    command: "node scripts/atlas-dev.mjs diff"
    checks:
      - check: "condition"
        script: "test ! -f db/schema.sql"
    options:
      shell: false
      cache: false
      runInCI: false

  atlas-lint:
    description: "Reject unsafe versioned migrations"
    type: "test"
    # Atlas's docker:// driver publishes to a random host port; scripts/atlas-dev.mjs runs the dev
    # database on this project's pinned port instead. Skip and CI semantics live in the script.
    command: "node scripts/atlas-dev.mjs lint"
    checks:
      - check: "condition"
        script: "test ! -f db/schema.sql"
    options:
      shell: false
      cache: false
      runInCI: "always"

  atlas-apply:
    description: "Apply pending migrations to DATABASE_URL"
    type: "run"
    toolchains: "system"
    script: >-
      atlas migrate apply
      --dir "file://db/migrations"
      --url "${DATABASE_URL:?set DATABASE_URL}"
    checks:
      - check: "condition"
        script: "test ! -f db/schema.sql"
    options:
      cache: false
      runInCI: false

  drizzle-generate:
    description: "Regenerate Drizzle types from the applied Atlas migrations"
    type: "run"
    command: "node scripts/drizzle-schema.mjs generate"
    checks:
      - check: "condition"
        script: "test ! -f db/schema.sql"
    options:
      shell: false
      cache: false
      runInCI: false

  drizzle-check:
    description: "Verify Drizzle types match the applied Atlas migrations"
    type: "test"
    command: "node scripts/drizzle-schema.mjs check"
    inputs:
      - "db/migrations/**/*"
      - "db/schema.sql"
      - "db/drizzle/_generated/**/*"
      - "scripts/drizzle-schema.mjs"
      - "scripts/lib/postgres-container.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
    checks:
      - check: "condition"
        script: "test ! -f db/schema.sql"
    options:
      shell: false
      cache: false
      runInCI: "always"

  # Neither db/schema.sql nor the Drizzle artifact records what the policies do: Atlas Community
  # drops them from a diff and drizzle-kit pull drops the USING expression from SELECT policies.
  # This task applies the migrations and observes the database, so it is the only gate that can
  # tell a scoped policy from an open one.
  rls-verify:
    description: "Prove row level security scopes rows in a real database"
    type: "test"
    command: "node scripts/rls-verify.mjs"
    inputs:
      - "db/migrations/**/*"
      - "db/schema.sql"
      - "scripts/rls-verify.mjs"
      - "scripts/lib/postgres-container.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
    checks:
      - check: "condition"
        script: "test ! -f db/schema.sql"
    options:
      shell: false
      cache: false
      runInCI: "always"

  rename-verifier:
    description: "Prove rename inputs are non-empty and the verdict is definite without proving token correctness"
    type: "test"
    command: "bash scripts/rename-template.sh --verify-contract"
    inputs:
      - "scripts/rename-template.sh"
    options:
      shell: false
      cache: false
      runInCI: "always"

  secrets:
    type: "test"
    command: "node scripts/check-security.mjs"
    inputs:
      - "@globs(sources)"
      - "/.github/**/*"
      - "/.env.example"
      - "/.npmrc"
      - "/.secretlintrc.json"
      - "/.secretlintignore"
    options:
      shell: false
      cache: false
      runInCI: "always"

  audit:
    type: "test"
    command: "pnpm audit"
    inputs:
      - "/package.json"
      - "/pnpm-lock.yaml"
      - "/pnpm-workspace.yaml"
    options:
      shell: false
      cache: false
      runInCI: "always"
