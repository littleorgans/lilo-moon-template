# The repository root as a project. Owns the workspace-wide quality gates:
# oxlint, oxfmt, secretlint, and pnpm audit run once rather than per project.
# project-refs evaluates the root tsconfig; per-project typecheck cannot.

layer: "application"

# The root is a task holder, not a TypeScript project. It must not inherit
# the per-project tasks in .moon/tasks/node.yml.
# inheritedTasks.include stops tasks, not fileGroups. replace keeps the
# root sources list from merging with node.yml globs.
workspace:
  inheritedTasks:
    include: []
  mergeStrategies:
    fileGroups: "replace"

fileGroups:
  sources:
    - ".moon/**/*"
    - "apps/**/*"
    - "packages/**/*"
    - "services/**/*"
    - "scripts/**/*"
    - "migrations/**/*"
    - "schema.sql"
    # Generated and installed files must not invalidate source task caches.
    - "!.moon/cache/**/*"
    - "!.moon/docker/**/*"
    - "!**/node_modules/**/*"
    - "!**/dist/**/*"
    - "!**/build/**/*"
    - "!**/out/**/*"
    - "!**/coverage/**/*"
    - "!**/*.tsbuildinfo"
    - "package.json"
    - "pnpm-workspace.yaml"
    - "tsconfig.json"
    - "tsconfig.options.json"
  # Empty lists replace inherited node.yml globs for these group names.
  configs: []
  tests: []

tasks:
  lint:
    type: "test"
    command: "oxlint --type-aware --deny-warnings --no-error-on-unmatched-pattern"
    inputs:
      - "@globs(sources)"
      - ".oxlintrc.json"
    options:
      runInCI: "always"

  lint-fix:
    type: "run"
    command: "oxlint --type-aware --fix --no-error-on-unmatched-pattern"
    options:
      cache: false
      runInCI: false

  format-check:
    type: "test"
    command: "oxfmt --check --no-error-on-unmatched-pattern"
    inputs:
      - "@globs(sources)"
    options:
      runInCI: "always"

  format:
    type: "run"
    command: "oxfmt --no-error-on-unmatched-pattern"
    options:
      cache: false
      runInCI: false

  # A workspace without a root tsconfig has no project references to check.
  # When it exists, --dry reports TS6053 for a dangling path and does not emit.
  # Member config globs invalidate the task on additions, removals, and edits.
  project-refs:
    type: "test"
    script: "test ! -f tsconfig.json || tsc --build --pretty --dry"
    inputs:
      - "apps/*/tsconfig*.json"
      - "packages/*/tsconfig*.json"
      - "services/*/tsconfig*.json"
      - "tsconfig.json"
      - "tsconfig.options.json"
    options:
      runInCI: "always"

  # schema.sql is the applicability boundary for every Atlas task. An absent
  # schema skips before Atlas or Docker starts. Once present, failures propagate.
  atlas-diff:
    description: "Generate a versioned migration from schema.sql"
    type: "run"
    toolchains: "system"
    command: "atlas migrate diff"
    args:
      - "--dir"
      - "file://migrations"
      - "--to"
      - "file://schema.sql"
      - "--dev-url"
      - "docker://postgres/17/dev?search_path=public"
    checks:
      - check: "condition"
        script: "test ! -f schema.sql"
    options:
      cache: false
      runInCI: false

  atlas-lint:
    description: "Reject unsafe versioned migrations"
    type: "test"
    toolchains: "system"
    # Local checks are a fast subset and announce a missing Docker daemon.
    # CI is authoritative: with a schema, Docker or Atlas failure fails the gate.
    script: |
      if test -z "${CI:-}" && ! docker info >/dev/null 2>&1; then
        echo "Atlas lint skipped locally: Docker is unavailable; CI will run it."
        exit 0
      fi
      selector="${MOON_BASE:+--git-base=$MOON_BASE}"
      selector="${selector:---latest=1}"
      atlas migrate lint \
        --dir "file://migrations" \
        --dev-url "docker://postgres/17/dev?search_path=public" \
        "$selector"
    checks:
      - check: "condition"
        script: "test ! -f schema.sql"
    options:
      cache: false
      runInCI: "always"

  atlas-apply:
    description: "Apply pending migrations to DATABASE_URL"
    type: "run"
    toolchains: "system"
    script: >-
      atlas migrate apply
      --dir "file://migrations"
      --url "${DATABASE_URL:?set DATABASE_URL}"
    checks:
      - check: "condition"
        script: "test ! -f schema.sql"
    options:
      cache: false
      runInCI: false

  drizzle-generate:
    description: "Regenerate Drizzle types from the applied Atlas migrations"
    type: "run"
    command: "node scripts/drizzle-schema.mjs generate"
    checks:
      - check: "condition"
        script: "test ! -f schema.sql"
    options:
      cache: false
      runInCI: false

  drizzle-check:
    description: "Verify Drizzle types match the applied Atlas migrations"
    type: "test"
    command: "node scripts/drizzle-schema.mjs check"
    inputs:
      - "migrations/**/*"
      - "schema.sql"
      - "drizzle/_generated/**/*"
      - "scripts/drizzle-schema.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
    checks:
      - check: "condition"
        script: "test ! -f schema.sql"
    options:
      cache: false
      runInCI: "always"

  secrets:
    type: "test"
    command: "node scripts/check-security.mjs"
    inputs:
      - "@globs(sources)"
      - "/.github/**/*"
      - "/.env.example"
      - "/.npmrc"
      - "/.secretlintrc.json"
      - "/.secretlintignore"
    options:
      cache: false
      runInCI: "always"

  audit:
    type: "test"
    command: "pnpm audit"
    inputs:
      - "/package.json"
      - "/pnpm-lock.yaml"
      - "/pnpm-workspace.yaml"
    options:
      cache: false
      runInCI: "always"
