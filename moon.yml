# The repository root as a project. Owns the workspace-wide quality gates:
# oxlint, oxfmt, secretlint, and pnpm audit run once rather than per project.
# project-refs evaluates the root tsconfig; per-project typecheck cannot.

layer: "application"

# The root is a task holder, not a TypeScript project. It must not inherit
# the per-project tasks in .moon/tasks/node.yml.
# inheritedTasks.include stops tasks, not fileGroups. replace keeps the
# root sources list from merging with node.yml globs.
workspace:
  inheritedTasks:
    include: []
  mergeStrategies:
    fileGroups: "replace"

fileGroups:
  sources:
    - ".moon/**/*"
    - "apps/**/*"
    - "packages/**/*"
    - "services/**/*"
    - "scripts/**/*"
    # Generated and installed files must not invalidate source task caches.
    - "!.moon/cache/**/*"
    - "!.moon/docker/**/*"
    - "!**/node_modules/**/*"
    - "!**/dist/**/*"
    - "!**/build/**/*"
    - "!**/out/**/*"
    - "!**/coverage/**/*"
    - "!**/*.tsbuildinfo"
    - "package.json"
    - "pnpm-workspace.yaml"
    - "tsconfig.json"
    - "tsconfig.options.json"
  # Empty lists replace inherited node.yml globs for these group names.
  configs: []
  tests: []

tasks:
  lint:
    type: "test"
    command: "oxlint --type-aware --deny-warnings --no-error-on-unmatched-pattern"
    inputs:
      - "@globs(sources)"
      - ".oxlintrc.json"
    options:
      runInCI: "always"

  lint-fix:
    type: "run"
    command: "oxlint --type-aware --fix --no-error-on-unmatched-pattern"
    options:
      cache: false
      runInCI: false

  format-check:
    type: "test"
    command: "oxfmt --check --no-error-on-unmatched-pattern"
    inputs:
      - "@globs(sources)"
    options:
      runInCI: "always"

  format:
    type: "run"
    command: "oxfmt --no-error-on-unmatched-pattern"
    options:
      cache: false
      runInCI: false

  # --dry reports TS6053 for a dangling path and does not emit.
  # Member config globs invalidate the task on additions, removals, and edits.
  project-refs:
    type: "test"
    command: "tsc --build --pretty --dry"
    inputs:
      - "apps/*/tsconfig*.json"
      - "packages/*/tsconfig*.json"
      - "services/*/tsconfig*.json"
      - "tsconfig.json"
      - "tsconfig.options.json"
    options:
      runInCI: "always"

  secrets:
    type: "test"
    command: "node scripts/check-security.mjs"
    inputs:
      - "@globs(sources)"
      - "/.github/**/*"
      - "/.env.example"
      - "/.npmrc"
      - "/.secretlintrc.json"
      - "/.secretlintignore"
    options:
      cache: false
      runInCI: "always"

  audit:
    type: "test"
    command: "pnpm audit"
    inputs:
      - "/package.json"
      - "/pnpm-lock.yaml"
      - "/pnpm-workspace.yaml"
    options:
      cache: false
      runInCI: "always"
