language: "typescript"
layer: "library"
tags:
  - "ts-library"

# The docker-backed tests apply @littleorgans/db's shipped migrations and compare the generated
# Drizzle schema with the committed one, so both are inputs or a change there replays a stale pass.
tasks:
  test:
    inputs:
      - "/packages/db/migrations/**/*"
      - "/db/drizzle/_generated/**/*"
  test-coverage:
    inputs:
      - "/packages/db/migrations/**/*"
      - "/db/drizzle/_generated/**/*"
