language: "typescript"
layer: "library"
tags:
  - "ts-library"

# Integration tests use the Postgres container helper from db-tools's source. Migration history also reads MOON_BASE (or origin/main),
# so do not reuse a cached pass after the base ref changes.
tasks:
  test:
    inputs:
      - "migrations/**/*"
      - "/packages/db-tools/src/**/*"
    options:
      cache: false
  test-coverage:
    inputs:
      - "migrations/**/*"
      - "/packages/db-tools/src/**/*"
    options:
      cache: false
