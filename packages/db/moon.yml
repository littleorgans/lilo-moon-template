language: "typescript"
layer: "library"
tags:
  - "ts-library"

# Integration tests use the shared helper. Migration history also reads MOON_BASE (or origin/main),
# so do not reuse a cached pass after the base ref changes.
tasks:
  test:
    inputs:
      - "migrations/**/*"
      - "/scripts/lib/postgres-container.mjs"
    options:
      cache: false
  test-coverage:
    inputs:
      - "migrations/**/*"
      - "/scripts/lib/postgres-container.mjs"
    options:
      cache: false
