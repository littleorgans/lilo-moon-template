packages:
  - "apps/*"
  - "packages/*"
  - "services/*"
  - "db/drizzle"

# lefthook's npm postinstall is unused. Root prepare runs scripts/install-hooks.mjs, which runs
# lefthook install from the main checkout only.
# pnpm 11 fails the install unless this package is listed here as a boolean.
allowBuilds:
  esbuild: true
  lefthook: false

# One version of every shared dependency, for the whole repo.
# Projects reference these with "catalog:" and never pin a version themselves.
catalog:
  "@hono/node-server": "2.1.1"
  "@tailwindcss/vite": "4.3.3"
  "@tanstack/react-router": "1.170.31"
  "@tanstack/react-start": "1.168.48"
  "@types/node": "^24.13.3"
  "@types/pg": "8.23.1"
  "@types/react": "^19.2.18"
  "@types/react-dom": "^19.2.4"
  "@vitejs/plugin-react": "^6.1.0"
  "@vitest/coverage-v8": "^4.1.11"
  "@workos-inc/node": "10.10.0"
  class-variance-authority: "0.7.1"
  clsx: "2.1.1"
  drizzle-kit: "0.31.10"
  drizzle-orm: "0.45.2"
  hono: "4.13.8"
  # 6.2.10 published inside the minimumReleaseAge window. Pin exactly, like pg and drizzle-kit.
  jose: "6.2.9"
  lucide-react: "1.33.0"
  nitro: "3.0.260610-beta"
  oxlint: "1.79.0"
  pg: "8.23.0"
  # Drives the browser in packages/workos-contract. The core alone: no test runner, no browser
  # download at install. The workflow installs the one browser it launches.
  playwright-core: "1.63.0"
  # shadcn new-york-v4 imports the unified package, not per-component @radix-ui/* entries.
  radix-ui: "1.6.7"
  react: "^19.2.8"
  react-dom: "^19.2.8"
  tailwind-merge: "3.6.0"
  tailwindcss: "4.3.3"
  typescript: "~7.0.2"
  vite: "^8.2.1"
  vitest: "^4.1.11"
  yaml: "2.9.0"

# Libraries declare peer ranges rather than the app pin: a caret on the supported major, never an
# open-ended >=, so a future major is an explicit decision.
catalogs:
  react-peer:
    react: "^19.0.0"
    react-dom: "^19.0.0"
  # Framework adapters declare the framework as a peer, so the application owns the version and
  # a consumer on a different framework never installs it.
  tanstack-peer:
    "@tanstack/react-router": "^1.170.0"
    "@tanstack/react-start": "^1.168.0"
  # Same reason for the bundler: packages/vite-config is loaded by the consumer's own Vite, so the
  # consumer owns the version and a second copy here would be a second Vite in the graph.
  vite-peer:
    vite: "^8.0.0"
  # vite-config/vitest types its defaults with Vitest's config types. Optional: a project that only
  # uses the Vite half never installs Vitest.
  vitest-peer:
    vitest: "^4.1.0"
  # packages/db exports Drizzle types, so a second drizzle-orm copy breaks consumer typechecks
  # (TS2345 on tx.execute). drizzle-orm is 0.x and breaks in minors, so the caret holds one minor;
  # published-shape installs the floor. pg is used only through Pool, but the named ESM import
  # (`import { Pool } from "pg"`) needs the ESM wrapper pg added in 8.15.0; earlier releases throw
  # "Named export 'Pool' not found" at load time.
  # db's ScopedTransaction is Drizzle's NodePgDatabase, whose execute() results are pg's types.
  # Without @types/pg they widen to `any` without an error, so db requires the types beside pg.
  db-peer:
    "@types/pg": "^8.15.0"
    drizzle-orm: "^0.45.0"
    pg: "^8.15.0"
  # db-tools drizzle-generate runs the project's own drizzle-kit, so the project pins the version
  # its committed artifact was generated with. 0.x breaks in minors, so the caret holds one minor.
  db-tools-peer:
    drizzle-kit: "^0.31.0"
  # packages/ui imports tailwindcss from CSS; a nested copy can differ from the one the consumer's
  # @tailwindcss/vite runs. 4.0.0 already parses every directive the package CSS uses.
  tailwind-peer:
    tailwindcss: "^4.0.0"
  # The auth-http Hono adapter. Optional: a service using only the Fetch core never installs Hono.
  # The floor is the release the adapter and its integration test run against.
  hono-peer:
    hono: "^4.13.0"
  # packages/oxlint-config names rules by the oxlint release that defines them; an older oxlint
  # rejects a rule it does not know. The floor is the release the config is linted with here.
  oxlint-peer:
    oxlint: "^1.79.0"

# pnpm 11 reads these from this file. A project .npmrc is auth and registry only.
autoInstallPeers: false
strictPeerDependencies: true
resolutionMode: highest

# Dependency lifecycle scripts do not run. Add an allowBuilds entry to approve
# one package. Unreviewed scripts fail the install.
strictDepBuilds: true

# Transitive git and tarball dependencies are blocked.
blockExoticSubdeps: true

# Newly published versions wait one day. Setting this explicitly turns on
# minimumReleaseAgeStrict; the implicit 1440 default does not.
minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
# 6.1.0 was published inside the window when the application exemplar locked it.
minimumReleaseAgeExclude:
  - "@vitejs/plugin-react@6.1.0"

# Fail install when a version's publish trust is weaker than earlier releases.
trustPolicy: no-downgrade
# semver 6.3.1 predates widespread npm provenance. Its attested 7.x line makes
# pnpm treat Babel's older dependency as a downgrade. The exact pin confines
# this exception. Remove it when @babel/core 8 and semver ^7.7.3 reach the tree.
trustPolicyExclude:
  - "semver@6.3.1"
trustLockfile: false

# High and critical advisories fail CI. Unfixable ones still fail until a GHSA
# is listed under ignore with a reason and ISO expiry. The secrets task rejects
# missing, invalid, duplicate, or expired policy comments.
audit:
  level: high

# drizzle-kit's deprecated loader pins a vulnerable esbuild. Keep this override scoped to that
# loader until upstream removes it. The Drizzle introspection gate exercises the replacement.
overrides:
  "@esbuild-kit/core-utils>esbuild": "0.25.12"
